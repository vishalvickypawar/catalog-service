name: Commit Stage
on: push

jobs:
  build:

    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Remove stale SARIF
        run: rm -f results.sarif anchore.sarif || true

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM with syft
        run: syft "${{ github.workspace }}" -o cyclonedx-json=sbom-cdx.json

      - name: Show SBOM
        run: |
          echo "SBOM head:"
          head -n 5 sbom-cdx.json || true
          ls -la sbom-cdx.json

      - name: Code vulnerability scanning (SBOM)
        uses: anchore/scan-action@v3
        id: scan
        with:
          sbom: sbom-cdx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Debug Anchore outputs
        run: |
          echo "steps.scan.outputs.sarif='${{ steps.scan.outputs.sarif }}'"
          ls -la "${{ github.workspace }}" || true
          ls -la anchore.* *.sarif || true
          if [ -n "${{ steps.scan.outputs.sarif }}" ]; then
            echo ">>> SARIF head (200 bytes):"
            head -c 200 "${{ steps.scan.outputs.sarif }}" || true
          fi

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          checkout_path: ${{ github.workspace }}


      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build