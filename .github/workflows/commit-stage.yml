name: Commit Stage
on: push

jobs:
  build:

    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: "${{ github.workspace }}"
          output-file: sbom.json

      - name: Code vulnerability scanning
        uses: anchore/scan-action@v3
        id: scan
        with:
          sbom: sbom.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Debug Anchore outputs
        run: |
          echo ">>> steps.scan.outputs.sarif='${{ steps.scan.outputs.sarif }}'"
          echo ">>> List workspace root"
          ls -la "${{ github.workspace }}" || true
          echo ">>> List any SARIF/anchore files"
          ls -la anchore.* *.sarif || true
          if [ -n "${{ steps.scan.outputs.sarif }}" ]; then
            echo ">>> Show first 200 bytes of SARIF file"
            head -c 200 "${{ steps.scan.outputs.sarif }}" || true
          fi

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          checkout_path: ${{ github.workspace }}

      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build